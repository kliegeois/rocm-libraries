---
include: rocsparse_common.yaml

# rocsparse_spsm() supports only CSR and COO. These cases assert that a CSC
# matrix is rejected with rocsparse_status_not_implemented. The guard is
# format-dependent (not size/precision-dependent), so only a small,
# representative set of cases is needed.
Tests:
- name: spsm_csc_not_implemented
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_double_precisions_complex_real
  M: 16
  N: 16
  K: [1, 8]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  baseA: [rocsparse_index_base_zero]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  spsm_alg: [rocsparse_spsm_alg_default]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  matrix: [rocsparse_matrix_random]

- name: spsm_csc_not_implemented
  category: quick
  function: spsm_csc
  indextype: *i64i32
  precision: *single_double_precisions
  M: 16
  N: 16
  K: [4]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseA: [rocsparse_index_base_one]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  spsm_alg: [rocsparse_spsm_alg_default]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  matrix: [rocsparse_matrix_random]
